name: Internal linker

on:
  schedule:
    # Every 30 min, 09:30-21:00 IST (04:00-15:30 UTC), Mon-Sat. GitHub may delay scheduled runs.
    - cron: "0,30 4-15 * * 1-6"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Process only this WordPress post id (optional)"
        required: false
      dry_run:
        description: "Dry run (log proposed links, don't edit WordPress)"
        type: boolean
        default: true

concurrency:
  group: internal-linker
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run linker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          MASTERSHEET_ID: ${{ secrets.MASTERSHEET_ID }}
          CONTROL_SHEET_ID: ${{ secrets.CONTROL_SHEET_ID }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Scheduled runs follow the repo variable DRY_RUN (defaults to dry run until you set it to "false").
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || vars.DRY_RUN || 'true' }}
        run: |
          if [ -n "${{ inputs.post_id }}" ]; then
            python -m linker.main --post-id "${{ inputs.post_id }}"
          else
            python -m linker.main
          fi

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linker-report-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
