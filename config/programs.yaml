# Program landing pages and how WordPress categories map onto them.
# Fill in each `url` (left blank on purpose; programs with no URL are skipped with a warning).
# `keywords` are anchor variants the linker may use, most preferred first. Keep 4-8 per program
# and mix exact, partial and descriptive phrasings so anchors don't all look identical.

programs:
  - id: ops
    name: "IIM Trichy - AI-Powered Operations & Process Transformation"
    url: ""
    categories: ["AI Powered Operations", "Business Operations", "Supply Chain Management"]
    keywords:
      - "AI-powered operations programme"
      - "operations management course"
      - "AI in operations course"
      - "IIM Trichy operations programme"

  - id: marketing
    name: "IIM Trichy - AI-Powered Marketing & Growth Strategy"
    url: ""
    categories: ["AI Powered Marketing"]
    keywords:
      - "AI-powered marketing programme"
      - "AI marketing course"
      - "AI digital marketing course"
      - "IIM Trichy marketing programme"

  - id: quantum
    name: "IIT Delhi - Applied Quantum Computing & AI"
    url: ""
    categories: ["Quantum Computing"]
    keywords:
      - "applied quantum computing programme"
      - "quantum computing course"
      - "quantum computing certification"
      - "IIT Delhi quantum computing programme"

  - id: fde
    name: "IIT Delhi - AI Forward Deployed Engineering"
    url: ""
    categories: ["Forward Deployed Engineering"]
    keywords:
      - "forward deployed engineering programme"
      - "FDE course"
      - "forward deployed engineer training"
      - "IIT Delhi FDE programme"

  - id: genai
    name: "IIT Delhi - Certificate Programme in Generative AI"
    url: ""
    categories: ["Generative AI"]
    keywords:
      - "generative AI programme"
      - "generative AI course"
      - "GenAI certification"
      - "IIT Delhi generative AI course"

  - id: aipm
    name: "IIT Delhi - Advanced Certificate in AI Product Management & Leadership"
    url: ""
    categories: ["AI Powered Product Management"]
    keywords:
      - "AI product management programme"
      - "AI product management course"
      - "AI PM certification"

# Categories close enough to borrow links from (scored as "adjacent", not "other").
adjacent_categories:
  "AI Powered Operations": ["Business Operations", "Supply Chain Management"]
  "Business Operations": ["AI Powered Operations", "Supply Chain Management"]
  "Supply Chain Management": ["AI Powered Operations", "Business Operations"]
  "Generative AI": ["Forward Deployed Engineering", "AI Powered Product Management"]
  "Forward Deployed Engineering": ["Generative AI", "AI Powered Product Management"]
  "AI Powered Product Management": ["Generative AI", "Forward Deployed Engineering", "AI Powered Marketing"]
  "AI Powered Marketing": ["AI Powered Product Management"]
  "Quantum Computing": ["Generative AI"]

# Optional: URLs that should be weighted as pillar pages (type weight "pillar" instead of "blog").
pillar_urls: []

# Optional: extra anchor variants for specific blog URLs, on top of what the MasterSheet gives.
keyword_overrides: {}
